<title>TikTik Open Items</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one section per screen; each shows the light and dark renderings side by side at real size (1 CSS px = 1 pt). */
:root {
  --page-bg: oklch(0.985 0 0); --page-fg: oklch(0.205 0 0); --page-muted: oklch(0.556 0 0); --page-border: oklch(0.922 0 0);
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: oklch(0.17 0 0); --page-fg: oklch(0.95 0 0); --page-muted: oklch(0.65 0 0); --page-border: oklch(1 0 0 / 12%); color-scheme: dark; } }
:root[data-theme="dark"] { --page-bg: oklch(0.17 0 0); --page-fg: oklch(0.95 0 0); --page-muted: oklch(0.65 0 0); --page-border: oklch(1 0 0 / 12%); color-scheme: dark; }
body { background: var(--page-bg); color: var(--page-fg); font-family: var(--sys); }

/* ---- TikTik theme tokens (zinc v4, monochrome, radius 10) ---- */
.t-light { --background: oklch(1 0 0); --foreground: oklch(0.141 0.005 285.823); --card: oklch(1 0 0); --primary: oklch(0.21 0.006 285.885); --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.967 0.001 286.375); --muted: oklch(0.967 0.001 286.375); --muted-foreground: oklch(0.552 0.016 285.938); --border: oklch(0.92 0.004 286.32);
  --destructive: oklch(0.577 0.245 27.325); --ring: oklch(0.705 0.015 286.067); --shot-bg: oklch(0.955 0.002 286); }
.t-dark { --background: oklch(0.141 0.005 285.823); --foreground: oklch(0.985 0 0); --card: oklch(0.21 0.006 285.885); --primary: oklch(0.92 0.004 286.32); --primary-foreground: oklch(0.21 0.006 285.885);
  --secondary: oklch(0.274 0.006 286.033); --muted: oklch(0.274 0.006 286.033); --muted-foreground: oklch(0.705 0.015 286.067); --border: oklch(1 0 0 / 10%);
  --destructive: oklch(0.704 0.191 22.216); --ring: oklch(0.552 0.016 285.938); --shot-bg: oklch(0.1 0.004 286); }
.t-light, .t-dark { --radius: 10px; --active: var(--primary); --idle: color-mix(in oklch, var(--primary) 45%, var(--background)); --away: color-mix(in oklch, var(--primary) 14%, var(--background)); }
.t-dark { --away: #38383B; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 40px 20px 64px; display: grid; gap: 44px; }
header h1 { font-size: 26px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--page-muted); line-height: 1.55; max-width: 72ch; }
section.screen { display: grid; gap: 14px; border-top: 1px solid var(--page-border); padding-top: 26px; }
.sh { display: grid; gap: 4px; }
.sh h2 { margin: 0; font-size: 18px; font-weight: 600; }
.sh p { margin: 0; color: var(--page-muted); font-size: 13px; line-height: 1.5; max-width: 80ch; }
.pair { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.scroller { overflow-x: auto; max-width: 100%; }
.shot { padding: 20px; background: var(--shot-bg); border-radius: 16px; display: inline-flex; gap: 20px; align-items: flex-start; }

/* ---- popover ---- */
.pop { width: 380px; height: 560px; box-sizing: border-box; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; display: flex; flex-direction: column; gap: 12px; font-family: var(--mono); font-size: 12.5px; overflow: hidden; }
.pop.auto { height: auto; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex: none; }
.ttl { font-weight: 600; font-size: 14px; }
.badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: calc(var(--radius) - 4px); border: 1px solid var(--border); white-space: nowrap; }
.tabs { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--muted); border-radius: var(--radius); padding: 3px; gap: 2px; flex: none; }
.tabs span { text-align: center; font-size: 12px; font-weight: 500; padding: 4px 0; border-radius: calc(var(--radius) - 2px); color: var(--muted-foreground); border: 1px solid transparent; }
.tabs span.on { background: var(--background); color: var(--foreground); border-color: var(--border); box-shadow: 0 1px 2px oklch(0 0 0 / 0.06); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); flex: none; }
.ringcard { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; padding: 12px; }
.ringlist { display: grid; gap: 6px; font-size: 12px; }
.ringlist div { display: flex; align-items: center; gap: 8px; }
.ringlist .v { margin-left: auto; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted-foreground); padding: 0 2px; flex: none; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--foreground); font-weight: 500; }
.chart { padding: 10px 12px 8px; display: grid; gap: 6px; position: relative; }
.ctitle { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-foreground); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.gl { stroke: var(--border); stroke-dasharray: 3 3; }
.ax { fill: var(--muted-foreground); font-size: 9px; font-family: var(--mono); }
.bar-m { fill: var(--primary); }
.chart g:hover .bar-m { fill: color-mix(in oklch, var(--primary) 70%, var(--background)); }
.hit { fill: transparent; }
.tip { position: absolute; pointer-events: none; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; white-space: nowrap; box-shadow: 0 2px 8px oklch(0 0 0 / 0.08); transform: translate(-50%, -110%); font-family: var(--mono); }

/* app list: App · Time · RAM · % */
.list { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0 12px; }
.list .rows { overflow-y: auto; min-height: 0; }
.cols { display: grid; grid-template-columns: 20px minmax(0,1fr) 50px 52px 30px 8px; gap: 4px 8px; align-items: center; }
.cols.h { font-size: 10px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 0 6px; border-bottom: 1px solid var(--border); flex: none; }
.cols.h .on { color: var(--foreground); }
.cols.r { padding: 10px 0; } .cols.r + .cols.r { border-top: 1px solid var(--border); }
.n { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
.n.m { color: var(--muted-foreground); } .n.hot { color: var(--foreground); font-weight: 600; }
.cols.h .n { font-size: 10px; }
.nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.icon { width: 20px; height: 20px; border-radius: 6px; background: var(--secondary); border: 1px solid var(--border); display: grid; place-items: center; font-size: 9.5px; font-weight: 600; color: var(--muted-foreground); box-sizing: border-box; }
.cols.r .icon, .cols.r .chev { grid-row: span 2; }
.chev { color: var(--muted-foreground); font-size: 12px; }
.bar { grid-column: 2 / 6; height: 6px; border-radius: 999px; background: color-mix(in oklch, var(--primary) 18%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; font-size: 11px; color: var(--muted-foreground); }
.iconbtn { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: calc(var(--radius) - 2px); color: var(--foreground); border: 1px solid transparent; }
.iconbtn.outline { border-color: var(--border); }

/* detail */
.back { font: inherit; font-size: 12px; background: transparent; border: 0; color: var(--foreground); padding: 0; }
.dhead { display: flex; align-items: center; gap: 10px; flex: none; }
.dhead .icon { width: 32px; height: 32px; font-size: 12px; border-radius: 8px; }
.dhead .t { display: grid; gap: 2px; } .dhead b { font-size: 15px; } .dhead small { color: var(--muted-foreground); font-size: 11px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; }
.kv div { padding: 8px 12px; display: grid; gap: 2px; }
.kv div:nth-child(2n) { border-left: 1px solid var(--border); }
.kv div:nth-child(n+3) { border-top: 1px solid var(--border); }
.kv small { color: var(--muted-foreground); font-size: 11px; } .kv b { font-weight: 500; }
.drows { padding: 0 12px; }
.drow { display: grid; grid-template-columns: minmax(0,1fr) auto 34px; gap: 4px 10px; align-items: center; padding: 8px 0; }
.drow + .drow { border-top: 1px solid var(--border); }
.drow .bar { grid-column: 1 / 4; height: 4px; }

/* settings + welcome */
.scroll { overflow-y: auto; display: grid; gap: 14px; align-content: start; min-height: 0; flex: 1 1 auto; }
.grp { display: grid; gap: 6px; } .glabel { font-size: 11px; color: var(--muted-foreground); padding-left: 2px; }
.set { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; align-items: center; padding: 11px 14px; }
.set + .set { border-top: 1px solid var(--border); }
.set b { font-weight: 500; } .set small { color: var(--muted-foreground); font-size: 11px; line-height: 1.45; grid-column: 1; }
.set > :last-child { grid-row: 1 / span 2; grid-column: 2; }
.switch { width: 32px; height: 18px; border-radius: 999px; background: var(--primary); position: relative; }
.switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--background); }
.switch.off { background: var(--border); } .switch.off::after { right: auto; left: 2px; }
.select { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 4px 8px 4px 10px; font-size: 12px; white-space: nowrap; }
.select::after { content: "⌄"; color: var(--muted-foreground); font-size: 11px; transform: translateY(-2px); }
.btn { font: inherit; font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: calc(var(--radius) - 2px); border: 1px solid var(--border); background: var(--background); color: var(--foreground); white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.btn.destructive { background: var(--destructive); color: oklch(0.985 0 0); border-color: transparent; }
.wwin { width: 520px; background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 12px; font-family: var(--mono); font-size: 12.5px; overflow: hidden; }
.wtb { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; } .wtb i { width: 12px; height: 12px; border-radius: 50%; background: var(--border); }
.wbody { padding: 4px 24px 22px; display: grid; gap: 18px; }
.wtitle { display: grid; gap: 4px; } .wtitle b { font-size: 17px; } .wtitle span { color: var(--muted-foreground); line-height: 1.5; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; }
.tile.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.tile .prev { height: 24px; border-radius: 6px; background: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 11.5px; }
.tile .tn { font-size: 11px; display: flex; justify-content: space-between; } .tile .tn em { font-style: normal; color: var(--muted-foreground); }
.wfoot { display: flex; justify-content: flex-end; }

/* menu bar */
.mbs { display: grid; gap: 10px; }
.mbrow { display: grid; grid-template-columns: 150px auto; gap: 12px; align-items: center; font-size: 12px; }
.mbrow span.l { color: var(--page-muted); }
.mb { --mb-bg: oklch(0.93 0.004 286); --mb-fg: oklch(0.15 0 0); --mb-hi: oklch(0 0 0 / 0.1); width: 400px; height: 26px; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 10px; background: var(--mb-bg); color: var(--mb-fg); border-radius: 8px; font-size: 13px; font-family: var(--sys); box-sizing: border-box; }
.t-dark .mb { --mb-bg: oklch(0.24 0.004 286); --mb-fg: oklch(0.96 0 0); --mb-hi: oklch(1 0 0 / 0.16); }
.mb .it { height: 22px; display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; border-radius: 5px; white-space: nowrap; }
.mb .me { background: var(--mb-hi); }
.mb .mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.tabs.seven { grid-template-columns: repeat(7, 1fr); }
.tabs.seven span { font-size: 11.5px; }
.tabs .live { display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.tabs .live::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.nowcard { padding: 14px; display: grid; gap: 12px; }
.nowtop { display: flex; align-items: center; gap: 12px; }
.nowtop .icon { width: 40px; height: 40px; font-size: 13px; border-radius: 10px; }
.nowtop .t { display: grid; gap: 3px; min-width: 0; flex: 1; }
.nowtop .t b { font-size: 15px; }
.nowtop .t small { color: var(--muted-foreground); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); white-space: nowrap; }
.state i { width: 6px; height: 6px; border-radius: 50%; background: var(--active); display: block; }
.state.idle i { background: var(--idle); }
.timer { display: flex; align-items: baseline; gap: 8px; }
.timer b { white-space: nowrap; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.timer small { color: var(--muted-foreground); font-size: 11px; }
.site { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 8px 10px; border-radius: calc(var(--radius) - 2px); background: var(--muted); }
.site span { color: var(--muted-foreground); }
.recent { padding: 4px 12px; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.rrow { display: grid; grid-template-columns: 44px 20px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 8px 0; font-size: 12px; }
.rrow + .rrow { border-top: 1px solid var(--border); }
.rrow .when { color: var(--muted-foreground); font-variant-numeric: tabular-nums; font-size: 11px; }
.rrow .dur { font-variant-numeric: tabular-nums; }
.rrow.idle .nm, .rrow.idle .dur { color: var(--muted-foreground); font-weight: 400; }
.rhead { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-foreground); padding: 10px 0 4px; }
.strip { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; }
.strip .nm small { color: var(--muted-foreground); font-weight: 400; }
.strip .tm { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: 12px; }
.strip .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--active); }
.strip .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); }

.hdr-glyph { display: inline-flex; align-items: center; gap: 6px; }
.banner { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--radius); border: 1px dashed var(--border); background: var(--muted); font-size: 12px; flex: none; }
.banner small { color: var(--muted-foreground); display: block; font-size: 11px; margin-top: 2px; }
.empty { flex: 1 1 auto; display: grid; place-items: center; text-align: center; padding: 24px; gap: 8px; align-content: center; }
.empty .eic { width: 40px; height: 40px; border-radius: 10px; border: 1px dashed var(--border); display: grid; place-items: center; color: var(--muted-foreground); margin: 0 auto; }
.empty b { font-size: 13px; } .empty span { color: var(--muted-foreground); font-size: 11.5px; line-height: 1.5; max-width: 260px; }
.textbtns { display: flex; gap: 2px; }
.textbtns span { font-size: 11.5px; padding: 4px 8px; border-radius: 6px; color: var(--foreground); }
.dimmed { opacity: 0.45; }
.ringcard.empty-ring svg circle { stroke: var(--muted); }
.optlabel { font-family: var(--sys); font-size: 12px; color: var(--page-muted); margin-bottom: 6px; }
.grid3 { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
</style>

<div class="wrap">
  <header>
    <h1>TikTik: open design items</h1>
    <p>The last four open items from the spec, mocked with the approved design system. Each option is shown in light and dark on the 6h tab (the default). Sections 1–3 are choices; section 4 is one proposed set of empty states to approve or adjust.</p>
  </header>
  <div id="screens" style="display:grid;gap:44px"></div>
</div>

<script>
// ---------- example data ----------
const RANGES = {
  "6h":  { tab: 0, badge: "Last 6h",  act: 214, idle: 22, away: 124, unit: "15 min", max: 15, yt: [0, 15], ticks: [0, 8, 16, 23], buckets: 24, step: 15 },
  "12h": { tab: 1, badge: "Last 12h", act: 302, idle: 41, away: 377, unit: "30 min", max: 30, yt: [0, 15, 30], ticks: [0, 8, 16, 23], buckets: 24, step: 30 },
  "24h": { tab: 2, badge: "Last 24h", act: 342, idle: 48, away: 1050, unit: "hour", max: 60, yt: [0, 30, 60], ticks: [0, 6, 12, 18, 23], buckets: 24, step: 60 },
  "1W":  { tab: 3, badge: "Sep 27 – Oct 3", act: 2289, idle: 330, away: 7461, unit: "day", max: 480, yt: [0, 240, 480], labels: ["Sat 27","Sun 28","Mon 29","Tue 30","Wed 1","Thu 2","Fri 3"], series: [95,40,410,452,398,512,382] },
  "1M":  { tab: 4, badge: "Sep 4 – Oct 3", act: 9420, idle: 1310, away: 32470, unit: "day", max: 600, yt: [0, 300, 600], labels: Array.from({length: 30}, (_, i) => { const d = new Date(2026, 8, 4 + i); return d.toLocaleDateString("en-US", {month: "short", day: "numeric"}); }), series: Array.from({length: 30}, (_, i) => { const dow = new Date(2026, 8, 4 + i).getDay(); return dow === 0 || dow === 6 ? 40 + (i * 13) % 70 : 300 + (i * 47) % 200; }) },
  "6M":  { tab: 5, badge: "Apr 4 – Oct 3", act: 48000, idle: 7200, away: 206880, unit: "week", max: 3000, yt: [0, 1500, 3000], labels: Array.from({length: 26}, (_, i) => { const d = new Date(2026, 3, 4 + i * 7); return "wk of " + d.toLocaleDateString("en-US", {month: "short", day: "numeric"}); }), series: [1800,2100,1950,2300,2200,800,600,2400,2500,2350,2280,2600,2450,1200,2300,2400,2550,2200,2380,2500,2610,2420,2050,2290,2350,1940] },
};
// [icon, name, share of active, RAM MB or null]
const APPS = [["Xc","Xcode",0.392,2150],["Ch","Google Chrome",0.269,3480],["Sl","Slack",0.14,612],["Fi","Figma",0.091,null],["Te","Terminal",0.079,88],["Mu","Music",0.029,141]];
const DOMAINS = [["github.com",38],["google.com",21],["stackoverflow.com",14],["youtube.com",9],["Private browsing",6],["4 others",4]];

// ---------- helpers ----------
const fmt = m => { m = Math.round(m); if (m < 1) return "<1m"; const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h ${String(r).padStart(2, "0")}m` : `${r}m`; };
const ram = mb => mb == null ? "—" : mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${mb} MB`;
const hot = mb => mb != null && mb >= 2048;
const pad2 = n => String(n).padStart(2, "0");
const NOW = { h: 14, m: 0 };
function rangeSeries(k) {
  const R = RANGES[k];
  if (R.series) return { values: R.series, labels: R.labels, tick: i => { const l = R.labels[i].replace("wk of ", ""); return R.series.length === 7 ? l.slice(0, 3) : R.series.length === 30 ? l : l.split(" ")[0]; } };
  const n = R.buckets, vals = [], labels = [];
  for (let i = 0; i < n; i++) {
    const minsAgo = (n - 1 - i) * R.step, t = (NOW.h * 60 + NOW.m - minsAgo + 1440 * 2) % 1440;
    labels.push(`${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`);
    const awake = !(k === "24h" && i >= 3 && i <= 16) && !(k === "12h" && i >= 2 && i <= 7) && !(k === "6h" && i >= 9 && i <= 12);
    vals.push(awake ? Math.round(R.max * (0.35 + 0.6 * Math.abs(Math.sin(i * 1.7 + R.step)))) : 0);
  }
  return { values: vals, labels, tick: i => i === n - 1 ? "now" : labels[i].slice(0, 5) };
}
function ring(R) {
  const T = R.act + R.idle + R.away, r = 34, C = 2 * Math.PI * r; let off = 0;
  const arcs = [["--active", R.act], ["--idle", R.idle], ["--away", R.away]].map(([c, m]) => { const len = m / T * C; const a = `<circle r="${r}" cx="42" cy="42" fill="none" stroke="var(${c})" stroke-width="10" stroke-dasharray="${Math.max(len - 2, 0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 42 42)"/>`; off += len; return a; }).join("");
  return `<div class="card ringcard"><svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">${arcs}<text x="42" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="var(--foreground)" font-family="JetBrains Mono, monospace">${Math.round(R.act / T * 100)}%</text></svg>

  ${title.startsWith("3") ? `<div class="sh" style="margin-top:8px"><h2 style="font-size:15px">Paused · menu bar</h2><p>Three options for the menu bar item while paused (shown with style A).</p></div><div class="pair">${["light","dark"].map(m => `<div class="shot t-${m}"><div class="mbs">${MBP.map(([l, c]) => `<div class="mbrow"><span class="l">${l}</span>${mbstrip(c)}</div>`).join("")}</div></div>`).join("")}</div>` : ""}
  </section>`).join("");
</script>
